[build-system]
requires = ["setuptools >= 40.9.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
  "C4",     # flake8-comprehensions
  "C90",    # mccabe complexity
  "D",      # pydocstyle
  "E",      # pycodestyle errors
  "F",      # pyflakes
  "I",      # isort
  "RUF100", # unused noqa comments
  "UP",     # pyupgrade
  "W",      # pycodestyle warnings
  # flake8-bandit: the checks previously enabled in tests/bandit.yaml
  "S103", "S108", "S306", "S307", "S313", "S314", "S315", "S316", "S317",
  "S318", "S319", "S601", "S602", "S604", "S608", "S609",
]
ignore = [
  "D202", # no blank lines allowed after function docstring
  "E501", # line too long (the formatter handles code; long strings are allowed)
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components"]

[tool.ruff.lint.mccabe]
max-complexity = 25

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.coverage.run]
omit = [".tox/*", "tests/*"]

[tool.pylint.MASTER]
ignore = ["tests"]
# Use a conservative default here; 2 should speed up most setups and not hurt
# any too bad. Override on command line as appropriate.
# Disabled for now: https://github.com/PyCQA/pylint/issues/3584
#jobs = 2
load-plugins = []
persistent = false
extension-pkg-whitelist = ["ciso8601", "cv2"]

[tool.pylint.BASIC]
good-names = ["_", "ex", "id", "T"]

[tool.pylint."MESSAGES CONTROL"]
# Reasons disabled:
# format - handled by ruff format
# locally-disabled - it spams too much
# duplicate-code - unavoidable
# cyclic-import - doesn't test if both import on load
# abstract-class-little-used - prevents from setting right foundation
# unused-argument - generic callbacks and setup methods create a lot of warnings
# too-many-* - are not enforced for the sake of readability
# too-few-* - same as too-many-*
# abstract-method - with intro of async there are always methods missing
# inconsistent-return-statements - doesn't handle raise
# too-many-ancestors - it's too strict.
# wrong-import-order - ruff (isort rules) guards this

# handled by mypy:
# no-member, unsupported-membership-test, unsupported-assignment-operation,
# unsubscriptable-object, used-before-assignment, bad-reversed-sequence
disable = [
    "format",
    "abstract-class-little-used",
    "abstract-method",
    "cyclic-import",
    "duplicate-code",
    "inconsistent-return-statements",
    "locally-disabled",
    "not-context-manager",
    "too-few-public-methods",
    "too-many-ancestors",
    "too-many-arguments",
    "too-many-branches",
    "too-many-instance-attributes",
    "too-many-lines",
    "too-many-locals",
    "too-many-public-methods",
    "too-many-return-statements",
    "too-many-statements",
    "too-many-boolean-expressions",
    "unused-argument",
    "wrong-import-order",
    "missing-docstring",
    "empty-docstring",
    "invalid-name",
    "fixme",
    "no-member",
    "unsupported-membership-test",
    "unsubscriptable-object",
    "unsupported-assignment-operation",
    "used-before-assignment",
    "bad-reversed-sequence",
]
enable = [
    #"useless-suppression",  # temporarily every now and then to clean them up
    "use-symbolic-message-instead",
]
extension-pkg-whitelist = "pydantic"

[tool.pylint.REPORTS]
score = false

[tool.pylint.TYPECHECK]
ignored-classes = [
    "_CountingAttr", # for attrs
]

[tool.pylint.FORMAT]
expected-line-ending-format = "LF"

[tool.pylint.EXCEPTIONS]
overgeneral-exceptions = ["BaseException", "Exception", "HomeAssistantError"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".git", "testing_config", ".tox"]
addopts = "--strict-markers --cov=custom_components"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
# https://mypy.readthedocs.io/en/stable/config_file.html
python_version = "3.14"
exclude = ["^tests/"]
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true
warn_return_any = true
strict = true
